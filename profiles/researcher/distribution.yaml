name: researcher
version: 1.0.0
description: "YouTube competitor research bot: yt-search, transcripts, creator beat-table breakdowns, weekday morning brief"
hermes_requires: ">=0.20.0"
author: "Tyler Reed"
license: "MIT"
env_requires:
  - name: ANTHROPIC_API_KEY
    description: "Model access (or swap model.provider in config.yaml)"
    required: true
  - name: YOUTUBE_API_KEY
    description: "YouTube Data API v3 key for yt-search and yt-analytics"
    required: true
  - name: SLACK_BOT_TOKEN
    description: "Only if you want this bot in Slack"
    required: false
